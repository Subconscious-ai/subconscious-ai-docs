        country: United States of America
        level_count: 4
        llm_model: gpt3
        why_prompt: I would like to design a new electric car for the American markets
    MotivationRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        user_profile_attributes:
          additionalProperties:
            anyOf:
            - items:
                type: string
              type: array
            - items:
                type: integer
              type: array
            - items:
                type: number
              type: array
          type: object
          title: User Profile Attributes
        history:
          items:
            type: string
          type: array
          title: History
        constraints:
          items:
            type: string
          type: array
          title: Constraints
        llm_model:
          anyOf:
          - $ref: '#/components/schemas/LLMModel'
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - user_profile_attributes
      - history
      - constraints
      title: MotivationRequest
      example:
        constraints:
        - Financial Constraints
        - Parking Availability
        - Timeline to Purchase
        history:
        - Previous Vehicle Type
        - Previous Driving Experience (Years)
        - Driving License
        llm_model: gpt4
        user_profile_attributes:
          age_levels:
          - 35
          - 45
          education_levels:
          - Masters Degree
          gender_levels:
          - Female
          income_levels:
          - 100000
          - 150000
        why_prompt: Why are you considering purchasing an electric vehicle?
    MotivationResponse:
      properties:
        motivation:
          items:
            type: string
          type: array
          title: Motivation
      type: object
      required:
      - motivation
      title: MotivationResponse
      example:
        motivation:
        - Financial
        - Social Norms
        - Status
        - Initial Cost
        - Infrastructure
        - Socially Driven
        - Status
    OrthogonalAttributesLevelsRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        country:
          type: string
          title: Country
        existing_attributes_levels:
          items:
            $ref: '#/components/schemas/LeveledAttribute'
          type: array
          title: Existing Attributes Levels
        new_attribute_count:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: New Attribute Count
          default: 4
        level_count:
          type: integer
          maximum: 5.0
          minimum: 2.0
          title: Level Count
          default: 3
        llm_model:
          anyOf:
          - $ref: '#/components/schemas/LLMModel'
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - country
      - existing_attributes_levels
      title: OrthogonalAttributesLevelsRequest
      description: Pydantic model for a request to create more, new, orthogonal levels
        for attributes.
      example:
        country: United States of America
        existing_attributes_levels:
        - attribute: Battery Range per Charge
          levels:
          - Less than 150 miles
          - 150 to 250 miles
          - 250 to 350 miles
          - 350 to 450 miles
          - More than 450 miles
        - attribute: Vehicle Warranty
          levels:
          - 3 years or 36,000 miles
          - 4 years or 50,000 miles
          - 5 years or 60,000 miles
          - 6 years or 70,000 miles
          - 7 years or 100,000 miles
        level_count: 3
        llm_model: gpt4
        new_attribute_count: 4
        why_prompt: I would like to design a new electric car for the American markets
    PopulationTraits:
      properties:
        age:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 2
            minItems: 1
          - type: integer
          - type: 'null'
          title: Age
        education:
          anyOf:
          - items:
              $ref: '#/components/schemas/EducationLevel'
            type: array
          - type: 'null'
          title: Education
        gender:
          anyOf:
          - items:
              $ref: '#/components/schemas/Gender'
            type: array
          - type: 'null'
          title: Gender
        income:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 2
            minItems: 1
          - type: integer
          - type: 'null'
          title: Income
      type: object
      title: PopulationTraits
    ProductAttributeRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        country:
          type: string
          title: Country
        attribute_count:
          type: integer
          maximum: 10.0
          minimum: 2.0
          title: Attribute Count
          default: 7
        level_count:
          type: integer
          maximum: 10.0
          minimum: 2.0
          title: Level Count
          default: 5
      type: object
      required:
      - why_prompt
      - country
      title: ProductAttributeRequest
      example:
        attribute_count: 7
        country: USA
        level_count: 5
        why_prompt: Why are you considering purchasing an electric vehicle?
    PromptType:
      type: string
      enum:
      - generic
      - service
      - product
      - experience
      - policy
      title: PromptType
      description: Enum representing the type of prompts used in experiment designs.
    Question:
      properties:
        question:
          type: string
          title: Question
        sample_responses:
          items:
            $ref: '#/components/schemas/SampleResponse'
          type: array
          title: Sample Responses
      type: object
      required:
      - question
      - sample_responses
      title: Question
      example:
        question: How often have you purchased the same brand of mobile phone in the
          past?
        sample_responses:
        - response: Always the same brand
        - response: Mostly the same brand
        - response: Occasionally the same brand
        - response: Rarely the same brand
        - response: Never the same brand
    QuestionList:
      items:
        $ref: '#/components/schemas/Question'
      type: array
      maxItems: 2
      minItems: 2
      title: QuestionList
    QuestionRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        user_profile_attributes:
          additionalProperties:
            anyOf:
            - items:
                type: string
              type: array
            - items:
                type: integer
              type: array
            - items:
                type: number
              type: array
          type: object
          title: User Profile Attributes
        model_dimensions:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Model Dimensions
        llm_model:
          anyOf:
          - $ref: '#/components/schemas/LLMModel'
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - user_profile_attributes
      - model_dimensions
      title: QuestionRequest
      example:
        llm_model: gpt4
        model_dimensions:
          constraints:
          - User Review
          - Budget
          history:
          - Previous Phone Brands
          - Price Sensitivity
        user_profile_attributes:
          age_levels:
          - 25
          - 30
          education_levels:
          - Bachelors Degree
          income_levels:
          - 50000
          - 75000
        why_prompt: What factors influence your choice in selecting a mobile phone?
    QuestionResponse:
      additionalProperties:
        additionalProperties:
          $ref: '#/components/schemas/QuestionList'
        type: object
      type: object
      title: QuestionResponse
      example:
        constraints:
          Budget:
          - question: How much does your budget limit your choice when selecting a
              mobile phone?
            sample_responses:
            - response: It is the primary factor, I only consider phones within my
                budget
            - response: It is a major factor, but I might stretch my budget for a
                good deal
            - response: It is somewhat important, but I consider other factors equally
            - response: It is a minor factor, I prioritize features over budget
            - response: It does not limit my choice at all, I choose based on features
                and brand
          - question: How often do you find yourself compromising on features due
              to budget constraints when selecting a mobile phone?
            sample_responses:
            - response: Always
            - response: Frequently
            - response: Occasionally
            - response: Rarely
            - response: Never
          User Review:
          - question: How often do you rely on user reviews when selecting a mobile
              phone?
            sample_responses:
            - response: Always
            - response: Often
            - response: Sometimes
            - response: Rarely
            - response: Never
          - question: To what extent do negative user reviews influence your decision
              to avoid purchasing a particular mobile phone?
            sample_responses:
            - response: Significantly
            - response: Moderately
            - response: Somewhat
            - response: Slightly
            - response: Not at all
        history:
          Previous Phone Brands:
          - question: How often have you purchased the same brand of mobile phone
              in the past?
            sample_responses:
            - response: Always
            - response: Mostly
            - response: Occasionally
            - response: Rarely
            - response: Never
          - question: How satisfied have you been with the mobile phone brands you
              have used previously?
            sample_responses:
            - response: Extremely satisfied
            - response: Very satisfied
            - response: Moderately satisfied
            - response: Slightly satisfied
            - response: Not satisfied at all
          Price Sensitivity:
          - question: How often have you chosen a mobile phone based on its price
              in the past?
            sample_responses:
            - response: Always
            - response: Most of the time
            - response: Sometimes
            - response: Rarely
            - response: Never
          - question: When you last purchased a mobile phone, how significant was
              the price in your decision?
            sample_responses:
            - response: Extremely significant
            - response: Very significant
            - response: Moderately significant
            - response: Slightly significant
            - response: Not significant at all
    RunRequest:
      properties:
        filters:
          type: object
          title: Filters
      type: object
      required:
      - filters
      title: RunRequest
      example:
        filters:
          config.user:
            $eq: user_id e.g. auth0|1234567890
          created_at:
            $gt: '2024-12-03T11:35:51.457984'
            $lte: '2024-12-04T11:35:51.457992'
    RunResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        state:
          type: string
          title: State
        tags:
          items:
            type: string
          type: array
          title: Tags
        created_at:
          type: string
          title: Created At
        config:
          type: object
          title: Config
      type: object
      required:
      - id
      - name
      - state
      - tags
      - created_at
      - config
      title: RunResponse
    SampleResponse:
      properties:
        response:
          type: string
          title: Response
      type: object
      required:
      - response
      title: SampleResponse
      example:
        response: Always the same brand
    SurveyResponseType:
      type: string
      enum:
      - probabilistic
      - discrete
      title: SurveyResponseType
    TraitLevel:
      properties:
        id:
          type: string
          title: Id
        set_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Set Type
        type:
          type: string
          title: Type
        measurement_type:
          type: string
          title: Measurement Type
        ordinal_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ordinal Rank
        short_description:
          type: string
          title: Short Description
        long_description:
          type: string
          title: Long Description
      type: object
      required:
      - id
      - set_type
      - type
      - measurement_type
      - ordinal_rank
      - short_description
      - long_description
      title: TraitLevel
    UpdateConfig:
      properties:
        config_update:
          type: object
          title: Config Update
      type: object
      required:
      - config_update
      title: UpdateConfig
      example:
        config_update:
          toggle_privacy: true
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
tags:
- name: experiments
  description: 🧪👨‍🔬⚗️Run a novel experiment using attributes, levels, traits, dependent
    variables, preambles, and personas and place results in a run.
  externalDocs:
    description: Description of the Experiment Request Body fields
    url: https://app.gitbook.com/o/jadOkacqKTkHvAmKDCti/s/RPAuLvXI0lCcTz39j3BR/repositories/backend/how-to-run-an-experiment/experiment-request-body-fields
- name: attributes_levels
  description: 📙 Generate product features (attributes) and their variations (levels)
- name: traits
  description: '**Why**. 🔬Causal factors that influence a person''s decision. Output:Return
    a list of persona traits that are available to subconscious.ai users.'
- name: personas
  description: '**Who**. 👪Who is the respondent? A respondent is made up of traits.
    Input: levels_per_trait - the number of levels of persona traits we would like
    to return per trait. trait_keys: a comma separated list of traits from the /traits
    endpoint. Output: Return a list of persona traits that are available to subconscious.ai
    users.'
- name: runs
  description: 📈Contains the experimental design + Experiment Results from WANDB.
- name: human-baselines
  description: 👥 Human baselines endpoints contains human baseline data and AMCEs
- name: copilot
  description: 🤖 AI-assisted experiment design and causal assumption validation
- name: stripe
  description: 💳 Manage Stripe payment processing operations
- name: tasks
  description: 📝 Monitor and manage Celery task statuses
- name: market-simulator
  description: 🏪 Simulate market conditions and consumer behaviors
- name: main
  description: 🛠️ Core system endpoints for health checks and diagnostics
- name: default
  description: 🔄 Experiment state management and real-time event handling
