          description: Successful Response
          content:
            application/json:
              schema: {}
  
components:
  schemas:
    AttributesLevelsRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        country:
          type: string
          title: Country
        prompt_type:
          anyOf:
          - $ref: '#/components/schemas/PromptType'
