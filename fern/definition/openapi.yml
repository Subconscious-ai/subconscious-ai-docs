          type: integer
          maximum: 7.0
          minimum: 2.0
          title: Attribute Count
          description: The number of attributes in the experiment. This value must
            be an integer between 2 and 7, inclusive. If not provided, the default
            value is 4. Each attribute represents a characteristic or feature of the
            experiment.
          default: 4
