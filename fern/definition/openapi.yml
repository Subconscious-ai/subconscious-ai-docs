  "/attributes-levels":
    post:
      tags:
      - attributes_levels
      - attributes_levels
      summary: Create Attributes And Levels
      description: |-
        Create attributes and levels for a given idea (why_prompt).

        Parameters:
        - `req`: AttributesLevelsRequest object containing:
            - `idea`: The main concept or prompt
            - `country`: Target country
            - `num_levels`: Number of levels per attribute (optional)
            - `max_length`: Maximum length for levels (optional)
            - `llm_model`: Language model to use (optional)
            - `num_attrs`: Number of attributes to generate (optional)

        Returns:
        - List of attributes with their levels.

        Example Response:
        ```json
        [
          {
            "attribute": "Price",
            "levels": [
              "The car costs $30,000",
              "The car costs $40,000",
              "The car costs $50,000",
              "The car costs $60,000",
              "The car costs $70,000"
            ]
          },
          {
            "attribute": "Safety Rating",
            "levels": [
              "The car has a 3-star safety rating",
              "The car has a 4-star safety rating",
              "The car has a 5-star safety rating",
              "The car has a 5.5-star safety rating"
            ]
          }
        ]
        ```

        Raises:
        - HTTPException 404: If an error occurs during creation
      operationId: create_attributes_and_levels_attributes_levels_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttributesLevelsRequest"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/LeveledAttributeBase"
                type: array
                title: Response Create Attributes And Levels Attributes Levels Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      security:
      - HTTPBearer: []
  "/attributes-levels/orthogonal":
