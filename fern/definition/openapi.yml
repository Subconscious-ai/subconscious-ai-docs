      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Showcase Analytics  Hb Id  Showcase Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  
  
  "/copilot/check-causality":
    post:
      tags:
      - copilot
      - copilot
      summary: Check Causality
      description: |-
        Check whether an idea is causal or not.

        Parameters:
        - `req`: CausalityRequest object containing:
            - `why_prompt`: The idea to check for causality
            - `llm_model`: Language model to use for the check (optional)

        Returns:
        - CausalityResponse object with the following structure:
            - `is_causal`: Boolean indicating whether the idea is causal
            - `suggestions`: List of up to 3 strings, each a rephrased version of the original idea as a causal idea

        Example Response:
        ```json
        {
            "is_causal": false,
            "suggestions": [
                "How does increasing the minimum wage affect employment rates?",
                "What is the impact of regular exercise on cardiovascular health?",
                "To what extent does parental involvement influence a child's academic performance?"
            ]
        }
        ```

        Raises:
        - HTTPException 500: If an error occurs during the causality check
      operationId: check_causality_copilot_check_causality_post
      security:
      - HTTPBearer: []
      parameters:
      - name: config
        in: query
        required: false
        schema:
          title: Config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CausalityRequest"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CausalityResponse"
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/copilot/check-moderation":
    post:
      tags:
      - copilot
      - copilot
      summary: Moderate
      description: |-
        Check whether an idea complies with our content policy.

        Parameters:
        - `why_prompt`: The idea to check for content policy compliance

        Returns:
        - JSONResponse object with the following structure:
            - `flagged`: Boolean indicating whether the content was flagged
            - `flagged_categories`: List of categories that were flagged (empty if not flagged)

        Example Response (flagged content):
        ```json
        {
            "flagged": true,
            "flagged_categories": ["violence", "hate"]
        }
        ```

        Example Response (non-flagged content):
        ```json
        {
            "flagged": false,
            "flagged_categories": []
        }
        ```

        Raises:
        - HTTPException 500: If an error occurs during the moderation check
      operationId: moderate_copilot_check_moderation_post
      security:
      - HTTPBearer: []
      parameters:
      - name: why_prompt
        in: query
        required: true
        schema:
          type: string
          title: Why Prompt
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  
  "/market-simulator/check-realworld-product":
    post:
      tags:
      - market-simulator
      - market-simulator
      summary: Check For Product
      description: |-
        Check if a product mentioned in the question exists in the real world.

        This endpoint uses a language model to assess whether a product described in the input question
        is likely to exist in reality. It makes multiple attempts to get a reliable result.

        Parameters:
        - `question`: String containing the question or description of the product to check

        Returns:
        - JSONResponse object with the following structure:
            - `product_exists`: Boolean indicating whether the product is likely to exist in the real world

        Example Request:
        ```
        {
            "question": "Does a smartphone that can project holograms exist?"
        }
        ```

        Example Response:
        ```json
        {
            "product_exists": false
        }
        ```

        Notes:
        - The check is performed using the GPT-4 language model
        - The endpoint makes up to 6 attempts to get a reliable result
        - The final result is based on the average of successful responses
        - A product is considered to exist if the average response is greater than 4 on a scale of 1-7

        Raises:
        - HTTPException 404: If the language model service is unavailable after multiple attempts
      operationId: check_for_product_market_simulator_check_realworld_product_post
      security:
      - HTTPBearer: []
      parameters:
      - name: question
        in: query
        required: true
        schema:
          type: string
          title: Question
      - name: config
        in: query
        required: false
        schema:
          title: Config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/":
    get:
      tags:
