  "/product_attribute_levels":
    post:
      tags:
      - attributes_levels
      - attributes_levels
      summary: Product Attribute Levels
      description: |-
        Generate product levels based on attributes and pricing information.

        This endpoint uses Perplexity API to process the input to generate a list of attributes that define the product or idea,
        generates pricing levels (brand & price pair), and creates levels for the provided attributes per brand/product.

        Parameters:
        - `req`: ProductAttributeRequest object containing:
            - `why_prompt`: The main question or prompt for the product
            - `country`: Target country for pricing and attributes
            - `num_attrs`: Number of attributes to generate (optional)
            - `num_levels`: Number of levels per attribute to generate (optional)

        Returns:
        - List of LeveledAttributeBase objects, each containing:
            - `attribute`: An Attribute object with:
                - `name`: The name of the attribute
            - `levels`: List of strings representing the different levels or options for the attribute

        Example Response:
        ```json
        [
          {
            "attribute": {
              "name": "Brands"
            },
            "levels": [
              "Tesla Model 3",
              "Ford Mustang Mach-E",
              "Volkswagen ID.4"
            ]
          },
          {
            "attribute": {
              "name": "Price"
            },
            "levels": [
              "38000 USD",
              "42000 USD",
              "46000 USD",
              "50000 USD",
              "54000 USD"
            ]
          }
        ]
        ```

        Raises:
        - HTTPException 404: If an error occurs during the processing of product levels

        Note:
        - The number of attributes and levels may vary based on the input parameters and product complexity
        - This function runs attribute generation and price level generation concurrently for efficiency
      operationId: product_attribute_levels_product_attribute_levels_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductAttributeRequest"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/LeveledAttributeBase"
                type: array
                title: Response Product Attribute Levels Product Attribute Levels
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
      security:
      - HTTPBearer: []
  
  "/traits":
    get:
      tags:
      - traits
      - traits
      summary: Get Traits
      description: |-
        Retrieve all traits from the database.

        Returns:
        - `List[TraitLevel]`: A list of TraitLevel objects representing all valid traits

        TraitLevel structure:
            - `id`: Unique identifier for the trait
            - `set_type`: Optional category of the trait (e.g., "Big Five", "8 Values")
            - `type`: The type of trait (e.g., "religion")
            - `measurement_type`: How the trait is measured ("nominal", "ordinal", "interval", "ratio")
            - `ordinal_rank`: Optional ranking for ordinal traits
            - `short_description`: Brief description of the trait level (e.g., "Satanist")
            - `long_description`: Detailed description of the trait level

        Example Response:
        ```json
        [
            {
                "id": "religion_1",
                "set_type": "Personal Values",
                "type": "religion",
                "measurement_type": "nominal",
                "short_description": "Satanist",
                "long_description": "My religion is Satanism"
            },
            {
                "id": "openness_2",
                "set_type": "Big Five",
                "type": "personality",
                "measurement_type": "ordinal",
                "ordinal_rank": 2,
                "short_description": "Medium Openness",
                "long_description": "I am somewhat open to new experiences"
            }
        ]
        ```
        Notes:
        - Invalid traits are logged and skipped
        - The total number of retrieved traits is logged

        Raises:
        - HTTPException 500: If an error occurs while fetching traits
      operationId: get_traits_traits_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/TraitLevel"
                type: array
                title: Response Get Traits Traits Get
      security:
      - HTTPBearer: []
  
