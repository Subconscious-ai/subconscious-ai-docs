  /copilot/check-causality:
    post:
      tags:
      - copilot
      - copilot
      summary: Check Causality
      description: "Check whether an why_prompt is causal or not.\n\nParameters:\n\
        - `req`: CausalityRequest object containing:\n    - `why_prompt`: The why_prompt\
        \ to check for causality\n    - `llm_model`: Language model to use for the\
        \ check (optional)\n\nReturns:\n- CausalityResponse object with the following\
        \ structure:\n    - `is_causal`: Boolean indicating whether the why_prompt\
        \ is causal\n    - `suggestions`: List of up to 3 strings, each a rephrased\
        \ version of the original why_prompt as a causal why_prompt\n\nExample Response:\n\
        ```json\n{\n    \"is_causal\": false,\n    \"suggestions\": [\n        \"\
        How does increasing the minimum wage affect employment rates?\",\n       \
        \ \"What is the impact of regular exercise on cardiovascular health?\",\n\
        \        \"To what extent does parental involvement influence a child's academic\
        \ performance?\"\n    ]\n}\n```\n\nRaises:\n- HTTPException 500: If an error\
        \ occurs during the causality check"
      operationId: check_causality_copilot_check_causality_post
      security:
      - HTTPBearer: []
    
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CausalityRequest'

      

      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CausalityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
                
  /copilot/check-moderation:
    post:
      tags:
      - copilot
      - copilot
      summary: Moderate
      description: "Check whether a why_prompt complies with our content policy.\n\
        \nParameters:\n- `why_prompt`: The prompt text to check for content policy\
        \ compliance\n\nReturns:\n- JSONResponse object with the following structure:\n\
        \    - `flagged`: Boolean indicating whether the content was flagged\n   \
        \ - `flagged_categories`: List of categories that were flagged (empty if not\
        \ flagged)\n\nExample Response (flagged content):\n```json\n{\n    \"flagged\"\
        : true,\n    \"flagged_categories\": [\"violence\", \"hate\"]\n}\n```\n\n\
        Example Response (non-flagged content):\n```json\n{\n    \"flagged\": false,\n\
        \    \"flagged_categories\": []\n}\n```\n\nRaises:\n- HTTPException 500: If\
        \ an error occurs during the moderation check"
      operationId: moderate_copilot_check_moderation_post
      security:
      - HTTPBearer: []
      parameters:
      - name: why_prompt
        in: query
        required: true
        schema:
          type: string
          title: Why Prompt
          example: How does social media usage affect sleep patterns?
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  
  /human-baselines/{hb_folder}/replications-amces:
    get:
      tags:
      - human-baselines
      summary: Fetch human baseline AMCEs for a specific folder
      description: "Fetches human baseline experiment data and AMCE results for unique\
        \ LLM models.\n\nArgs:\n    hb_folder (str): The name of the human baseline\
        \ folder.\n\nReturns:\n    dict: A dictionary containing hb data and unique\
        \ replication details."
      operationId: fetch_human_baseline_replications_amces_human_baselines__hb_folder__replications_amces_get
      security:
      - HTTPBearer: []
      parameters:
      - name: hb_folder
        in: path
        required: true
        schema:
          type: string
          title: Hb Folder
          example: Abramova2022

      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Fetch Human Baseline Replications Amces Human Baselines  Hb
                  Folder  Replications Amces Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /market-simulator/check-realworld-product:
    post:
      tags:
      - market-simulator
      - market-simulator
      summary: Check For Product
      description: "Check if a product mentioned in the question exists in the real\
        \ world.\n\nThis endpoint uses a language model to assess whether a product\
        \ described in the input question\nis likely to exist in reality. It makes\
        \ multiple attempts to get a reliable result.\n\nParameters:\n- `question`:\
        \ String containing the question or description of the product to check\n\n\
        Returns:\n- JSONResponse object with the following structure:\n    - `product_exists`:\
        \ Boolean indicating whether the product is likely to exist in the real world\n\
        \nExample Request:\n```\n{\n    \"question\": \"Does a smartphone that can\
        \ project holograms exist?\"\n}\n```\n\nExample Response:\n```json\n{\n  \
        \  \"product_exists\": false\n}\n```\n\nNotes:\n- The check is performed using\
        \ the GPT-4 language model\n- The endpoint makes up to 6 attempts to get a\
        \ reliable result\n- The final result is based on the average of successful\
        \ responses\n- A product is considered to exist if the average response is\
        \ greater than 4 on a scale of 1-7\n\nRaises:\n- HTTPException 404: If the\
        \ language model service is unavailable after multiple attempts"
      operationId: check_for_product_market_simulator_check_realworld_product_post
      security:
      - HTTPBearer: []
      parameters:
      - name: question
        in: query
        required: true
        schema:
          type: string
          title: Question
          example: Does a smartphone that can project holograms exist?
      
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
