        ```

        Raises:
        - HTTPException 404: If an error occurs during creation
      operationId: create_orthogonal_attributes_and_levels_attributes_levels_orthogonal_post
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrthogonalAttributesLevelsRequest"
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/LeveledAttributeBase"
                type: array
                title: Response Create Orthogonal Attributes And Levels Attributes
