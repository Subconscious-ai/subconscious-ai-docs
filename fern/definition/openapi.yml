          type: integer
          maximum: 5.0
          minimum: 2.0
          title: Level Count
          description: The number of levels in the experiment. This value must be
            an integer between 2 and 5, inclusive. If not provided, the default value
            is 4. Each level represents a different possible value or state of an
            attribute.
          default: 4
