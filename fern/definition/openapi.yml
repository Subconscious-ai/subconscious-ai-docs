        attributes:
          items:
            type: string
          type: array
          title: Attributes
        num_levels:
          type: integer
          maximum: 10
          minimum: 2
          title: Num Levels
          default: 4
        llm_model:
          anyOf:
          - "$ref": "#/components/schemas/LLMModel"
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - country
      - attributes
      title: LevelsRequest
      example:
        attributes:
        - Battery Range per Charge
        - Vehicle Warranty
        country: United States of America
        llm_model: gpt3
        num_levels: 4
        why_prompt: I would like to design a new electric car for the American markets
    MotivationRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        user_profile_attributes:
          additionalProperties:
            anyOf:
            - items:
                type: string
              type: array
            - items:
                type: integer
              type: array
            - items:
                type: number
              type: array
          type: object
          title: User Profile Attributes
        history:
          items:
            type: string
          type: array
          title: History
        constraints:
          items:
            type: string
          type: array
          title: Constraints
        llm_model:
          anyOf:
          - "$ref": "#/components/schemas/LLMModel"
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - user_profile_attributes
      - history
      - constraints
      title: MotivationRequest
      example:
        constraints:
        - Financial Constraints
        - Parking Availability
        - Timeline to Purchase
        history:
        - Previous Vehicle Type
        - Previous Driving Experience (Years)
        - Driving License
        llm_model: gpt4
        user_profile_attributes:
          age_levels:
          - 35
          - 45
          education_levels:
          - Masters Degree
          gender_levels:
          - Female
          income_levels:
          - 100000
          - 150000
        why_prompt: Why are you considering purchasing an electric vehicle?
    MotivationResponse:
      properties:
        motivation:
          items:
            type: string
          type: array
          title: Motivation
      type: object
      required:
      - motivation
      title: MotivationResponse
      example:
        motivation:
        - Financial
        - Social Norms
        - Status
        - Initial Cost
        - Infrastructure
        - Socially Driven
        - Status
    OrthogonalAttributesLevelsRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        country:
          type: string
          title: Country
        existing_attributes_levels:
          items:
            "$ref": "#/components/schemas/LeveledAttribute"
          type: array
          title: Existing Attributes Levels
        number_of_new_attributes:
          type: integer
          maximum: 5
          minimum: 1
          title: Number Of New Attributes
          default: 4
        number_of_levels:
          type: integer
          maximum: 5
          minimum: 2
          title: Number Of Levels
          default: 3
        llm_model:
          anyOf:
          - "$ref": "#/components/schemas/LLMModel"
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - country
      - existing_attributes_levels
      title: OrthogonalAttributesLevelsRequest
      description: Pydantic model for a request to create more, new, orthogonal levels
        for attributes.
      example:
        country: United States of America
        existing_attributes_levels:
        - attribute: Battery Range per Charge
          levels:
          - Less than 150 miles
          - 150 to 250 miles
          - 250 to 350 miles
          - 350 to 450 miles
          - More than 450 miles
        - attribute: Vehicle Warranty
          levels:
          - 3 years or 36,000 miles
          - 4 years or 50,000 miles
          - 5 years or 60,000 miles
          - 6 years or 70,000 miles
          - 7 years or 100,000 miles
        llm_model: gpt4
        number_of_levels: 3
        number_of_new_attributes: 4
        why_prompt: I would like to design a new electric car for the American markets
    PopulationTraits:
      properties:
        age:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 2
            minItems: 1
          - type: integer
          - type: 'null'
          title: Age
        education:
          anyOf:
          - items:
              "$ref": "#/components/schemas/EducationLevel"
            type: array
          - type: 'null'
          title: Education
        gender:
          anyOf:
          - items:
              "$ref": "#/components/schemas/Gender"
            type: array
          - type: 'null'
          title: Gender
        income:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 2
            minItems: 1
          - type: integer
          - type: 'null'
          title: Income
      type: object
      title: PopulationTraits
    ProductAttributeRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        country:
          type: string
          title: Country
        num_attrs:
          type: integer
          maximum: 10
          minimum: 2
          title: Num Attrs
          default: 7
        num_levels:
          type: integer
          maximum: 10
          minimum: 2
          title: Num Levels
          default: 5
      type: object
      required:
      - why_prompt
      - country
      title: ProductAttributeRequest
      example:
        country: USA
        num_attrs: 7
        num_levels: 5
        why_prompt: Why are you considering purchasing an electric vehicle?
    PromptType:
      type: string
      enum:
      - generic
      - service
      - product
      - experience
      - policy
      title: PromptType
      description: Enum representing the type of prompts used in experiment designs.
    Question:
      properties:
        question:
          type: string
          title: Question
        sample_responses:
          items:
            "$ref": "#/components/schemas/SampleResponse"
          type: array
          title: Sample Responses
      type: object
      required:
      - question
      - sample_responses
      title: Question
      example:
        question: How often have you purchased the same brand of mobile phone in the
          past?
        sample_responses:
        - response: Always the same brand
        - response: Mostly the same brand
        - response: Occasionally the same brand
        - response: Rarely the same brand
        - response: Never the same brand
    QuestionList:
      items:
        "$ref": "#/components/schemas/Question"
      type: array
      maxItems: 2
      minItems: 2
      title: QuestionList
    QuestionRequest:
      properties:
        why_prompt:
          type: string
          title: Why Prompt
        user_profile_attributes:
          additionalProperties:
            anyOf:
            - items:
                type: string
              type: array
            - items:
                type: integer
              type: array
            - items:
                type: number
              type: array
          type: object
          title: User Profile Attributes
        model_dimensions:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Model Dimensions
        llm_model:
          anyOf:
          - "$ref": "#/components/schemas/LLMModel"
          - type: 'null'
          default: gpt4
      type: object
      required:
      - why_prompt
      - user_profile_attributes
      - model_dimensions
      title: QuestionRequest
      example:
        llm_model: gpt4
        model_dimensions:
          constraints:
          - User Review
          - Budget
          history:
          - Previous Phone Brands
          - Price Sensitivity
        user_profile_attributes:
          age_levels:
          - 25
          - 30
          education_levels:
          - Bachelors Degree
          income_levels:
          - 50000
          - 75000
        why_prompt: What factors influence your choice in selecting a mobile phone?
    QuestionResponse:
      additionalProperties:
        additionalProperties:
          "$ref": "#/components/schemas/QuestionList"
        type: object
      type: object
      title: QuestionResponse
      example:
        constraints:
          Budget:
          - question: How much does your budget limit your choice when selecting a
              mobile phone?
            sample_responses:
            - response: It is the primary factor, I only consider phones within my
                budget
            - response: It is a major factor, but I might stretch my budget for a
                good deal
            - response: It is somewhat important, but I consider other factors equally
            - response: It is a minor factor, I prioritize features over budget
            - response: It does not limit my choice at all, I choose based on features
                and brand
          - question: How often do you find yourself compromising on features due
              to budget constraints when selecting a mobile phone?
            sample_responses:
            - response: Always
            - response: Frequently
            - response: Occasionally
            - response: Rarely
            - response: Never
          User Review:
          - question: How often do you rely on user reviews when selecting a mobile
              phone?
            sample_responses:
            - response: Always
            - response: Often
            - response: Sometimes
            - response: Rarely
            - response: Never
          - question: To what extent do negative user reviews influence your decision
              to avoid purchasing a particular mobile phone?
            sample_responses:
            - response: Significantly
            - response: Moderately
            - response: Somewhat
            - response: Slightly
            - response: Not at all
        history:
          Previous Phone Brands:
          - question: How often have you purchased the same brand of mobile phone
              in the past?
            sample_responses:
            - response: Always
            - response: Mostly
            - response: Occasionally
            - response: Rarely
            - response: Never
          - question: How satisfied have you been with the mobile phone brands you
              have used previously?
            sample_responses:
            - response: Extremely satisfied
            - response: Very satisfied
            - response: Moderately satisfied
            - response: Slightly satisfied
            - response: Not satisfied at all
          Price Sensitivity:
          - question: How often have you chosen a mobile phone based on its price
              in the past?
            sample_responses:
            - response: Always
            - response: Most of the time
            - response: Sometimes
            - response: Rarely
            - response: Never
          - question: When you last purchased a mobile phone, how significant was
              the price in your decision?
            sample_responses:
            - response: Extremely significant
            - response: Very significant
            - response: Moderately significant
            - response: Slightly significant
            - response: Not significant at all
    RunRequest:
      properties:
        filters:
          type: object
          title: Filters
      type: object
      required:
      - filters
      title: RunRequest
      example:
        filters:
          config.user:
            "$eq": user_id e.g. auth0|1234567890
          created_at:
            "$gt": '2024-11-11T16:22:34.700271'
            "$lte": '2024-11-12T16:22:34.700278'
    RunResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        state:
          type: string
          title: State
        tags:
          items:
            type: string
          type: array
          title: Tags
        created_at:
          type: string
          title: Created At
        config:
          type: object
          title: Config
      type: object
      required:
      - id
      - name
      - state
      - tags
      - created_at
      - config
      title: RunResponse
    SampleResponse:
      properties:
        response:
          type: string
          title: Response
      type: object
      required:
      - response
      title: SampleResponse
      example:
        response: Always the same brand
    SurveyResponseType:
      type: string
      enum:
      - Probabilistic
      - Discrete
      title: SurveyResponseType
    TraitLevel:
      properties:
        id:
          type: string
          title: Id
        set_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Set Type
        type:
          type: string
          title: Type
        measurement_type:
          type: string
          title: Measurement Type
        ordinal_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ordinal Rank
        short_description:
          type: string
          title: Short Description
        long_description:
          type: string
          title: Long Description
      type: object
      required:
      - id
      - set_type
      - type
      - measurement_type
      - ordinal_rank
      - short_description
      - long_description
      title: TraitLevel
    UpdateConfig:
      properties:
        config_update:
          type: object
          title: Config Update
      type: object
      required:
      - config_update
      title: UpdateConfig
      example:
        config_update:
          toggle_privacy: true
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
tags:
