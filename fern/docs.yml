instances:
  - url: subconscious.docs.buildwithfern.com
    custom-domain: docs.subconscious.ai

title: Subconscious AI | Docs

tabs:
  about:
    display-name: Wiki
    icon: "fa-duotone fa-star"
  docs:
    display-name: Documentation
    icon: "fa-duotone fa-book-open"
  api:
    display-name: Dashboard API
    icon: "fa-duotone fa-webhook"
  newapi:
    display-name: Build a new feature
    icon: "fa-duotone fa-lightbulb"
    href: ""

navigation:
  - tab: about
    layout:
      - section: About Us
        contents:
          - page: Our Team
            path: ./docs/pages/our_team.mdx

          - page: Our Roadmap
            path: ./docs/pages/road_map.mdx
      
      - section: Product
        contents:
        - page: Feature Request/Bug Report
          path: ./docs/pages/product/feature_bug.mdx

        - page: How We Compare Results
          path: ./docs/pages/product/compare_result.mdx

        - page: Experiment Performance
          path: ./docs/pages/product/experiment_result_performance.mdx

        - page: Experiment Showcase
          path: ./docs/pages/product/experiment_performance_showcase.mdx

        - page: FAQ
          path: ./docs/pages/product/FAQ.mdx
      
      - section: Support
        contents:
        - page: Careers
          path: ./docs/pages/support/careers.mdx

        - page: Contact
          path: ./docs/pages/support/contact.mdx

        - page: Terms of Use
          path: ./docs/pages/support/terms.mdx      

        - page: Privacy Policy
          path: ./docs/pages/support/pp.mdx

  - tab: docs
    layout:
      - section: Get Started
        contents:
          - page: Welcome to Subconscious.ai
            path: ./docs/pages/welcome.mdx

          - page: Reference Implementation
            path: ./docs/pages/getting_started.mdx
  - tab: api
    layout:
      - api: API Reference

  - tab: newapi


navbar-links:
  - type: secondary
    text: Login
    url: https://www.subconscious.ai/api/auth/login
  - type: primary
    text: Join the Waitlist
    url: https://wf371uu1w6g.typeform.com/to/Tob1gFLA?typeform-source=www.subconscious.ai

colors:
  accentPrimary:
    dark: "#8E9BE9"
  background:
    dark: "#212336"

layout:
  searchbar-placement: header

logo:
  dark: ./docs/assets/logo-dark.png
  height: 32

favicon: ./docs/assets/favicon.ico
