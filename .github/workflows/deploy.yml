name: Deploy

# DISARMED on 2026-07-27, and kept only so the next person does not repeat the
# experiment.
#
# Vercel stopped producing production deployments for squash merges to main
# while pull request previews kept building. Eleven merges landed and none of
# them shipped, and nothing reported it. A deploy hook was the obvious fix, so
# this job fired one on every push.
#
# The hook does not work either. Vercel answers HTTP 201 with a PENDING job and
# then builds nothing: three fired, zero deployments, and no cancelled or
# errored deployment to account for them. So the job went green while nothing
# shipped, which is worse than having no job at all.
#
# Manual trigger only until someone watches a fired hook produce a build. Then
# put the push trigger back.
on:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Vercel to build main
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set, so nothing will deploy."
            exit 1
          fi
          code=$(curl -sS -X POST -o response.json -w '%{http_code}' "$HOOK")
          cat response.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel refused the deploy hook (HTTP $code)."
            exit 1
          fi
          echo "Vercel accepted the build request (HTTP $code)."
