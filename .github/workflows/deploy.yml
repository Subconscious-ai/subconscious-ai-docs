name: Deploy

# Vercel's own GitHub integration stopped producing production deployments for
# pushes to main on 2026-07-27, while pull request previews kept building. It
# accepts the work and silently drops it: no deployment, not even a skipped or
# errored one. A deploy hook behaves the same way, answering HTTP 201 with a
# PENDING job that never becomes a build. Thirteen merges landed and none of
# them shipped, and nothing reported it.
#
# Creating the deployment explicitly, with the commit pinned, does work. So this
# job does that and then watches the build to completion, because the whole
# lesson of that day is that an accepted request is not a deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: prj_1CFOWQ7ViJzZP8Z0GXHj1KpYBbyE
  TEAM_ID: team_r7qfZjPRL59Kpngiullfrtsf
  REPO_NAME: subconscious-ai-docs
  BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      checks: read
    steps:
      # `build` is a required check on main, so an ordinary merge cannot carry
      # a red build. An admin merge can. This is the backstop for that, and it
      # costs one API call.
      - name: Require the build to have passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            state=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "build")] | first
                    | if . == null then "absent"
                      elif .status != "completed" then "running"
                      else .conclusion end')
            case "$state" in
              success) echo "build passed"; exit 0 ;;
              failure|cancelled|timed_out|action_required)
                echo "::error::build concluded $state; refusing to deploy."
                exit 1 ;;
            esac
            echo "  build: $state"
            sleep 15
          done
          echo "::error::build never concluded. Refusing to deploy blind."
          exit 1

      - name: Create the production deployment
        id: create
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set, so nothing will deploy."
            exit 1
          fi
          payload=$(jq -nc \
            --arg name "$REPO_NAME" --arg project "$PROJECT_ID" \
            --arg ref "$BRANCH" --arg sha "$SHA" --arg repo "$REPO_NAME" \
            '{name:$name, project:$project, target:"production",
              gitSource:{type:"github", ref:$ref, sha:$sha,
                         org:"Subconscious-ai", repo:$repo}}')
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID&skipAutoDetectionConfirmation=1" \
            -d "$payload")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error::Vercel refused the deployment."
            printf '%s\n' "$resp" | jq -r '.error.message // .' | head -5
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Created $id for $SHA"

      - name: Wait for it to be READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ID: ${{ steps.create.outputs.id }}
        run: |
          set -euo pipefail
          # Docusaurus builds this site in about three minutes. Twenty is slack,
          # not an expectation.
          deadline=$((SECONDS + 1200))
          while [ $SECONDS -lt $deadline ]; do
            state=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$ID?teamId=$TEAM_ID" \
              | jq -r '.readyState')
            case "$state" in
              READY)
                echo "Deployed. https://docs.subconscious.ai"
                exit 0 ;;
              ERROR|CANCELED)
                echo "::error::Deployment finished $state."
                echo "https://vercel.com/subconcious/docs/$ID"
                exit 1 ;;
            esac
            echo "  $state"
            sleep 20
          done
          echo "::error::Still not READY after 20 minutes. Check Vercel."
          exit 1
