name: Secret scan

# A live Auth0 client secret reached the public site through a content import.
# This is the check that would have caught it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history too, not just the tip

      # The gitleaks binary is MIT and free. Only the gitleaks-action wrapper
      # requires a paid licence on organisation repositories, which is why the
      # action failed on every run here and scanned nothing.
      # Pinned by version and checksum, the same way market-ontology does it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLf -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tgz gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="--all"
