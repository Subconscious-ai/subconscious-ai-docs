name: Secret scan

# A live Auth0 client secret reached the public site through a content import.
# This is the check that would have caught it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history too, not just the tip

      # The gitleaks binary is MIT and free. Only the gitleaks-action wrapper
      # requires a paid licence on organisation repositories, which is why the
      # action failed on every run here and scanned nothing.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLf \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="--all"
