name: Verify production docs

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  verify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove canonical production routes and exact revision
        working-directory: site
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          PRODUCTION_URL: https://docs.subconscious.ai
        run: node scripts/verify-production.mjs
