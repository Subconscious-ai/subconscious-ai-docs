name: Reindex search

# Legacy Algolia index, retained for manual recovery only. The public site
# builds its bundled search index with each Docusaurus release.
on:
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Crawl and index
        env:
          APPLICATION_ID: ${{ secrets.ALGOLIA_APP_ID }}
          API_KEY: ${{ secrets.ALGOLIA_WRITE_KEY }}
        run: node site/scripts/reindex-search.mjs
