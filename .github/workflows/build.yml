name: Build docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: site
    steps:
      # Pin the checkout to the same commit the revision stamp claims. On a
      # pull_request, checkout defaults to GitHub's merge ref, so the build
      # would come from a commit that exists nowhere while revision.json
      # asserted the head sha. That is a false proof, in the one workflow whose
      # job is proving what was built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_SOURCE_REVISION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate docs
        # This is the same contributor gate documented in AGENTS.md.
        run: bash scripts/agent/validate-fast.sh

      - name: Verify exact build revision
        run: |
          test "$(jq -r .revision build/revision.json)" = "$DOCS_SOURCE_REVISION"
          echo "Built docs revision: $DOCS_SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ env.DOCS_SOURCE_REVISION }}
          path: site/build
          if-no-files-found: error

