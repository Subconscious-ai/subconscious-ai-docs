name: Build docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: site
    steps:
      # Pin the checkout to the same commit the revision stamp claims. On a
      # pull_request, checkout defaults to GitHub's merge ref, so the build
      # would come from a commit that exists nowhere while revision.json
      # asserted the head sha. That is a false proof, in the one workflow whose
      # job is proving what was built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_SOURCE_REVISION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Verify release-proof scripts
        run: pnpm run test:release-proof

      - name: Check migration and retirement evidence
        run: pnpm run check:migration-evidence

      - name: Test blocked agent source consumption contracts
        run: pnpm run test:agent-source-contracts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # Broken links and broken anchors fail the build by config.
        run: pnpm build

      - name: Verify exact build revision
        run: |
          test "$(jq -r .revision build/revision.json)" = "$DOCS_SOURCE_REVISION"
          echo "Built docs revision: $DOCS_SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ env.DOCS_SOURCE_REVISION }}
          path: site/build
          if-no-files-found: error

      - name: Check the spec is in sync with rehoboam
        # Warns rather than fails: the docs spec is pinned deliberately, and a
        # backend merge should not turn this repo red. It should be visible.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REHOBOAM_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::REHOBOAM_READ_TOKEN not set; skipping spec drift check"
            exit 0
          fi
          gh api "repos/Subconscious-ai/rehoboam/contents/openapi.public.json?ref=develop" \
            --jq '.content' | base64 -d > /tmp/upstream.json
          if ! diff -q /tmp/upstream.json openapi/subconscious.public.json > /dev/null; then
            echo "::warning::The published spec has moved on in rehoboam. Run 'pnpm run sync-spec'."
          fi
