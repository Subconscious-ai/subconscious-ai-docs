name: Sync API spec

# Answers "does anything re-sync the spec automatically?" — now yes.
#
# rehoboam is the source of truth for openapi.public.json. Until this existed
# the copy in this repo only moved when someone ran scripts/sync-spec.sh by
# hand, so the published API reference could silently lag the API. This checks
# daily and opens a PR when they differ, rather than committing straight to
# main: a spec change can alter what is publicly documented, which deserves a
# human look.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published contract from rehoboam
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.REHOBOAM_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::REHOBOAM_READ_TOKEN not set; cannot read the private repo"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd site
          REHOBOAM_REF=develop bash scripts/sync-spec.sh
          if git diff --quiet -- \
            openapi/subconscious.public.json \
            static/openapi/subconscious.public.json \
            provenance/sources/openapi.public.provenance.json \
            provenance/sources.json; then
            echo "contract is already in sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a PR with the new spec
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-api-spec
          title: "chore: sync the API spec from rehoboam"
          commit-message: "chore: sync the API spec from rehoboam"
          body: |
            The published contract in rehoboam has moved on. Merging this
            refreshes the schema, downloadable copy, provenance manifest, and
            exact source digests used by the API reference and playground.

            Review what changed before merging — a new operation appearing here
            means it was deliberately published in
            `rehoboam/docs/api/public_surface.yml`.
          delete-branch: true
