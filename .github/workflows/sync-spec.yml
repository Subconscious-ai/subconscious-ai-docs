name: Sync released API and MCP contracts

on:
  workflow_dispatch:
  schedule:
    # Lightweight release detection, with a daily full reconciliation.
    - cron: "17 * * * *"
    - cron: "0 7 * * *"

concurrency:
  group: sync-released-contracts
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the successful release and live revision
        id: release
        # Hourly detection stays quiet during deployment transitions. Daily
        # reconciliation and explicit manual runs surface persistent failures.
        continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule != '0 7 * * *' }}
        env:
          GH_TOKEN: ${{ secrets.REHOBOAM_READ_TOKEN }}
        run: |
          node site/scripts/require-ci-env.mjs GH_TOKEN
          node site/scripts/resolve-released-contract.mjs > /tmp/released-contract.json
          if [ '${{ github.event.schedule }}' = '17 * * * *' ] && cmp -s /tmp/released-contract.json site/provenance/release.json; then
            echo "Current successful release is already documented."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the exact released public contracts
        if: steps.release.outcome == 'success' && steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REHOBOAM_READ_TOKEN }}
        run: |
          REHOBOAM_REF="$(jq -r .revision /tmp/released-contract.json)" bash site/scripts/sync-spec.sh
          cp /tmp/released-contract.json site/provenance/release.json
          node --test site/scripts/agent-source-contracts.test.mjs site/scripts/resolve-released-contract.test.mjs

      - name: Maintain one contract sync PR
        id: pr
        if: steps.release.outcome == 'success' && steps.release.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-api-spec
          title: "docs: sync the released API and MCP contracts"
          commit-message: "docs: sync the released API and MCP contracts"
          add-paths: |
            site/openapi/subconscious.public.json
            site/static/openapi/subconscious.public.json
            site/provenance/sources/openapi.public.provenance.json
            site/provenance/sources/mcp-tools.public.json
            site/provenance/sources.json
            site/provenance/release.json
          body: |
            Synchronizes the source-owned public REST and MCP contracts from a
            successful production deployment whose revision matches the live
            health receipt. The release identity is in site/provenance/release.json.

            The existing build generates the references and checks source pins.
            Public visibility changes remain ordinary reviewable changes.
            This PR is updated in place; no new PR or comment is posted when clean.
          delete-branch: true

      - name: Run normal checks for the bot-created head
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        # workflow_dispatch is the supported exception; no extra PAT is needed.
        run: |
          gh workflow run build.yml --ref chore/sync-api-spec
          gh workflow run secret-scan.yml --ref chore/sync-api-spec
