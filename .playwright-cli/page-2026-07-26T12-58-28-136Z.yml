              - heading [level=3] [ref=f2e112]:
                - text: Purpose of the Logging Tool
                - link "Direct link to Purpose of the Logging Tool" [ref=f2e113] [cursor=pointer]:
                  - /url: "#purpose-of-the-logging-tool"
                  - text: "#"
              - paragraph [ref=f2e114]: When running experiments on the backend server, each Weights and Biases run contains run logs which track what happens in the experiment and what the results are. Searching through these logs becomes a tedious process of downloading each log file and manually searching through it. With Elasticsearch, all log information is centralized and easily searchable with minimum search times. Runs can be searched by user, run name/id, date of experiment, and more. Logging is set up to be constantly tracking the backend server and sending logs to Elasticsearch.
              - paragraph [ref=f2e115]: All logs are visualized and searchable in the Kibana dashboard.
              - paragraph [ref=f2e116]: Later in this guide there will be some preset search queries to simplify search for most users.
              - heading [level=2] [ref=f2e117]:
                - text: Requirements
                - link "Direct link to Requirements" [ref=f2e118] [cursor=pointer]:
                  - /url: "#requirements"
                  - text: "#"
              - paragraph [ref=f2e119]: All you need currently for accessing the Kibana dashboard are the links in the next section. In the future, once security is added, you may need to sign in to your azure account or subconscious email to access the dashboard.
              - paragraph [ref=f2e120]:
                - strong [ref=f2e121]: "In order to modify the elasticsearch container, you need an Azure account and permission to modify the ELKVM2 resource:"
                - link "https://portal.azure.com/#@aviyashchingmail.onmicrosoft.com/resource/subscriptions/49f25966-49b5-4c0b-818a-938a91ee88da/resourceGroups/ELKResourceGroup/providers/Microsoft.Compute/virtualMachines/ELKVM2/overview" [ref=f2e122] [cursor=pointer]:
                  - /url: https://portal.azure.com/#@aviyashchingmail.onmicrosoft.com/resource/subscriptions/49f25966-49b5-4c0b-818a-938a91ee88da/resourceGroups/ELKResourceGroup/providers/Microsoft.Compute/virtualMachines/ELKVM2/overview
              - heading [level=2] [ref=f2e123]:
                - text: Accessing the Kibana Dashboard
                - link "Direct link to Accessing the Kibana Dashboard" [ref=f2e124] [cursor=pointer]:
                  - /url: "#accessing-the-kibana-dashboard"
                  - text: "#"
              - paragraph [ref=f2e125]:
                - text: "Opening the Kibana Dashboard is simply following this URL:"
                - link "http://20.85.211.209:5601" [ref=f2e126] [cursor=pointer]:
                  - /url: http://20.85.211.209:5601
                - text: To access the log stream, go to
                - link "http://20.85.211.209:5601/app/logs/stream" [ref=f2e127] [cursor=pointer]:
                  - /url: http://20.85.211.209:5601/app/logs/stream
                - text: The log stream is useful in watching logs enter elasticsearch live and search them instantly.
              - figure [ref=f2e128]
              - paragraph [ref=f2e129]:
                - text: "To have better searchability and visualization, go to the Kibana discover page:"
                - link "http://20.85.211.209:5601/app/discover#" [ref=f2e130] [cursor=pointer]:
                  - /url: http://20.85.211.209:5601/app/discover
                - text: In the top left, select the blue box for the log stream view and select the
                - strong [ref=f2e131]: filebeat-*
                - text: option. Further searches can be done using the search bar.
              - figure [ref=f2e132]:
                - paragraph [ref=f2e134]: Selecting the filebeat log view in the top left of the Kibana Discover dashboard
              - heading [level=3] [ref=f2e135]:
                - text: Authentication and User Permissions
                - link "Direct link to Authentication and User Permissions" [ref=f2e136] [cursor=pointer]:
                  - /url: "#authentication-and-user-permissions"
                  - text: "#"
              - paragraph [ref=f2e137]: TODO
              - heading [level=2] [ref=f2e138]:
