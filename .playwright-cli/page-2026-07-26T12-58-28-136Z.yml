                - link "Direct link to Preset Kibana Search Queries" [ref=f2e139] [cursor=pointer]:
                  - /url: "#preset-kibana-search-queries"
                  - text: "#"
              - paragraph [ref=f2e140]: TODO
              - heading [level=2] [ref=f2e141]:
                - text: Accessing the Elastic VM Instance
                - link "Direct link to Accessing the Elastic VM Instance" [ref=f2e142] [cursor=pointer]:
                  - /url: "#accessing-the-elastic-vm-instance"
                  - text: "#"
              - heading [level=3] [ref=f2e143]:
                - text: Connecting to the VM via SSH
                - link "Direct link to Connecting to the VM via SSH" [ref=f2e144] [cursor=pointer]:
                  - /url: "#connecting-to-the-vm-via-ssh"
                  - text: "#"
              - paragraph [ref=f2e145]: We can connect to the Elastic VM through the Azure Cloud Shell. In your Azure portal, select the red circled option in the top nav bar to open the cloud shell.
              - figure [ref=f2e146]
              - paragraph [ref=f2e147]:
                - text: "In the Cloud shell opened in the same tab, ssh into the VM using the following command:"
                - code [ref=f2e148]: ssh azureuser@20.85.211.209
              - figure [ref=f2e149]
              - paragraph [ref=f2e150]:
                - text: "You should now be in the elasticsearch VM. To test whether the elasticsearch service is running, type the following command into the cloud terminal:"
                - code [ref=f2e151]: sudo curl -XGET 'localhost:9200/'
              - paragraph [ref=f2e152]:
                - text: "If your output is as below, elasticsearch is running:"
                - code [ref=f2e153]: "{ \"name\" : \"ELKVM2\", \"cluster_name\" : \"elasticsearch\", \"cluster_uuid\" : \"Y1qc2gjbReaKH0v3JIu47A\", \"version\" : { \"number\" : \"8.6.2\", \"build_flavor\" : \"default\", \"build_type\" : \"deb\", \"build_hash\" : \"2d58d0f136141f03239816a4e360a8d17b6d8f29\", \"build_date\" : \"2023-02-13T09:35:20.314882762Z\", \"build_snapshot\" : false, \"lucene_version\" : \"9.4.2\", \"minimum_wire_compatibility_version\" : \"7.17.0\", \"minimum_index_compatibility_version\" : \"7.0.0\" }, \"tagline\" : \"You Know, for Search\" }"
                - text: "Some useful commands in the elasticsearch VM: &#xNAN;"
                - strong [ref=f2e154]:
                  - code [ref=f2e155]: sudo systemctl start elasticsearch.service
                - text: "- Used to start the elasticsearch service if not running"
              - paragraph [ref=f2e156]:
                - strong [ref=f2e157]:
                  - code [ref=f2e158]: sudo systemctl start kibana.service
                - text: "- Used to start the kibana service if not running. Use in conjunction the prior command"
              - paragraph [ref=f2e159]:
                - strong [ref=f2e160]:
                  - code [ref=f2e161]: sudo systemctl stop elasticsearch.service
                - text: "- Used to stop the elasticsearch service. To restart elasticsearch without shutting the VM down, run this command and then the first two commands. Can be changed to stop kibana service as well."
              - heading [level=2] [ref=f2e162]:
                - text: Logging Runs from Backend Server
                - link "Direct link to Logging Runs from Backend Server" [ref=f2e163] [cursor=pointer]:
                  - /url: "#logging-runs-from-backend-server"
                  - text: "#"
              - paragraph [ref=f2e164]: Logging in the backend server is setup mainly through the logging and ecs_logging python modules along with Filebeat as the log shipper to elasticsearch.
              - heading [level=3] [ref=f2e165]:
                - text: Integration Steps
                - link "Direct link to Integration Steps" [ref=f2e166] [cursor=pointer]:
                  - /url: "#integration-steps"
                  - text: "#"
              - paragraph [ref=f2e167]:
                - text: "Log messages are included in some critical files which hold much of the experiment run functionality like poc_api.py, main.py, and core.py, to capture as much of the experiment run execution as possible. Filebeat is a log shipper which scans log files and sends them to elasticsearch. The configuration options are in the filebeat.yml file in github:"
                - link "https://github.com/Subconscious-ai/backend/tree/develop/backend" [ref=f2e168] [cursor=pointer]:
                  - /url: https://github.com/Subconscious-ai/backend/tree/develop/backend
                - text: To include new files to log from, follow the steps below.
              - list [ref=f2e169]:
                - listitem [ref=f2e170]:
                  - paragraph [ref=f2e171]:
                    - text: "In the python file you want to log from, import ecs_logging. Then copy the code below:"
                    - code [ref=f2e172]: logger = logging.getLogger(__name__)
                    - code [ref=f2e173]: logger.setLevel(logging.INFO)
                    - code [ref=f2e174]: "handler = logging.FileHandler(f'{PROJECT_ROOT_DIRECTORY}/backend/elk_logs/"
                    - mark [ref=f2e175]:
                      - code [ref=f2e176]: "**OUTPUT_LOG_FILE**"
                    - code [ref=f2e177]: "', mode='a')"
                    - code [ref=f2e178]: handler.setFormatter(ecs_logging.StdlibFormatter()) logger.addHandler(handler)
                    - text: Change the **OUTPUT_LOG_FILE** to any name you want for the log output file. Once this code is added, you can simply call the logger as you would the normal python logging utility (
                    - code [ref=f2e179]: logger.info()
                    - text: ","
                    - code [ref=f2e180]: logger.error()
                    - text: ", etc)."
                - listitem [ref=f2e181]:
                  - paragraph [ref=f2e182]: "Next, in the filebeat.yml file, add a new block under filebeat.inputs with the following code:"
                  - paragraph [ref=f2e183]:
                    - code [ref=f2e184]: "- type: filestream"
                    - code [ref=f2e185]: "# Unique ID among all inputs, an ID is required."
                    - code [ref=f2e186]: "id: poc-api-logs"
                    - code [ref=f2e187]: "# Change to true to enable this input configuration."
                    - code [ref=f2e188]: "enabled: true"
                    - code [ref=f2e189]: "# Paths that should be crawled and fetched. Glob based paths."
                    - code [ref=f2e190]: "paths:"
                    - code [ref=f2e191]: "- {PWD}/backend/elk_logs/"
                    - mark [ref=f2e192]:
                      - code [ref=f2e193]: "**OUTPUT_LOG_FILE**"
                    - code [ref=f2e194]: .json
                    - code [ref=f2e195]: "json.keys_under_root: true"
                    - code [ref=f2e196]: "json.add_error_key: true"
                    - code [ref=f2e197]: "json.expand_keys: true"
                    - text: "Again replacing **OUTPUT_LOG_FILE** with the chosen file name. With this, any logs generated by the python file will be parsed into ecs formatted logs, pre built for Elasticsearch, and shipped by Filebeat with no further action required. To learn more about the elastic schema configuration, visit this documentation:"
                    - link "https://www.elastic.co/guide/en/ecs/current/index.html" [ref=f2e198] [cursor=pointer]:
                      - /url: https://www.elastic.co/guide/en/ecs/current/index.html
