                  - text: "#"
              - paragraph [ref=e133]:
                - text: The API is versioned in the path (
                - code [ref=e134]: /api/v1
                - text: ","
                - code [ref=e135]: /api/v2
                - text: ). A version is never changed in place; new behaviour arrives as a new path. Requests and responses are JSON. All published endpoints require a bearer token.
              - paragraph [ref=e136]:
                - text: "Long-running work is asynchronous: you receive a run id immediately and poll for completion. See"
