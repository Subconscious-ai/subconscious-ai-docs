                  - text: "#"
              - list [ref=e120]:
                - listitem [ref=e121]:
                  - strong [ref=e122]: Experiment design
                  - text: — generate attributes and levels for a research question, build an orthogonal design matrix, and write respondent instructions.
                - listitem [ref=e123]:
                  - strong [ref=e124]: Populations
                  - text: — select and validate a synthetic respondent population from demographic and trait targeting.
                - listitem [ref=e125]:
                  - strong [ref=e126]: Execution
                  - text: — run the survey against simulated respondents.
                - listitem [ref=e127]:
                  - strong [ref=e128]: Results
                  - text: — retrieve AMCEs, importance scores, willingness-to-pay, and the raw artifacts behind them.
                - listitem [ref=e129]:
                  - strong [ref=e130]: Human baselines
                  - text: — compare simulated results against replicated human studies.
              - heading [level=2] [ref=e131]:
